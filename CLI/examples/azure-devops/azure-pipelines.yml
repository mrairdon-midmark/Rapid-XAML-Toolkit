trigger:
  branches:
    include:
    - main
    - develop

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: AnalyzeXAML
  displayName: 'Analyze XAML Files'
  jobs:
  - job: Analyze
    displayName: 'XAML Analysis'
    steps:
    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        version: '8.0.x'
    
    - script: |
        dotnet tool install --global RapidXaml.Cli
      displayName: 'Install Rapid XAML CLI'
    
    - script: |
        rxt analyze --project $(Build.SourcesDirectory)/src/MyApp/MyApp.csproj --format msbuild
      displayName: 'Analyze XAML files'
      continueOnError: false
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Analysis Results'
      condition: always()
      inputs:
        PathtoPublish: 'xaml-analysis-results.json'
        ArtifactName: 'xaml-analysis'

- stage: GenerateXAML
  displayName: 'Generate XAML'
  dependsOn: []
  jobs:
  - job: Generate
    displayName: 'XAML Generation'
    steps:
    - task: UseDotNet@2
      displayName: 'Setup .NET'
      inputs:
        version: '8.0.x'
    
    - script: |
        dotnet tool install --global RapidXaml.Cli
      displayName: 'Install Rapid XAML CLI'
    
    - script: |
        rxt generate \
          --input $(Build.SourcesDirectory)/src/MyApp/ViewModels/MainViewModel.cs \
          --output $(Build.SourcesDirectory)/src/MyApp/Views/MainView.xaml \
          --project-type Maui
      displayName: 'Generate XAML from ViewModels'
    
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Generated XAML'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/src/MyApp/Views'
        ArtifactName: 'generated-xaml'
